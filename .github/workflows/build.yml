name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: 8.4

    - name: Download static busybox to assets
      run: |
        mkdir -p app/src/main/assets
        # 这里是关键：改用专门适配 Android 64位 ARM 的静态 busybox
        curl -L -o app/src/main/assets/busybox https://github.com/EXALAB/AnLinux-Resources/raw/master/usr/busybox/busybox-arm64
        chmod +x app/src/main/assets/busybox

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: RootScriptLauncher-APK
        path: app/build/outputs/apk/debug/app-debug.apk
